<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISB Morning Assembly — Bookings</title>
    <style>
        /* Minimal, light theme — designed to sit inside an iframe (e.g. Google Sheets / Sites) */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            font-size: 13px;
            color: #1f2937;
            background: #ffffff;
            padding: 12px;
        }

        h1 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        #meta {
            font-size: 12px;
            color: #6b7280;
            margin-bottom: 10px;
            min-height: 1.2em;
        }

        table {
            border-collapse: collapse;
            width: 100%;
        }

        thead th {
            position: sticky;
            top: 0;
            background: #f3f4f6;
            z-index: 1;
        }

        th,
        td {
            border: 1px solid #e5e7eb;
            padding: 6px 8px;
            text-align: left;
            white-space: nowrap;
        }

        th {
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            color: #374151;
        }

        tr:nth-child(even) {
            background: #f9fafb;
        }

        tr:hover {
            background: #eef2ff;
        }

        td.topic {
            white-space: normal;
            min-width: 120px;
        }

        a {
            color: #2563eb;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .error {
            color: #dc2626;
        }
    </style>
</head>

<body>
    <h1>SISB Morning Assembly — Bookings</h1>
    <p id="meta"></p>
    <table id="bookingsTable">
        <thead>
            <tr>
                <th>Date</th>
                <th>Start</th>
                <th>Duration</th>
                <th>Name / Department</th>
                <th>Topic</th>
                <th>Slide Link</th>
            </tr>
        </thead>
        <tbody id="bookingsBody"></tbody>
    </table>

    <script type="module" src="bookings-table.js"></script>
</body>

</html>
