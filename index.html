<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer-when-downgrade">
    <title>SISB Morning Assembly Booking</title>
    <!-- Google Fonts for Premium Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <div class="container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <h2><i class="fa-solid fa-list-check"></i> Bookings</h2>
            <div class="sidebar-controls">
                <span>This Month</span>
            </div>
            <!-- Google Sign-In (Firebase Auth) -->
            <button id="googleSignInBtn" class="google-signin-btn" type="button">
                <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
                    <path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303c-1.649 4.657-6.08 8-11.303 8-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z"/>
                    <path fill="#FF3D00" d="M6.306 14.691l6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 16.318 4 9.656 8.337 6.306 14.691z"/>
                    <path fill="#4CAF50" d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238C29.211 35.091 26.715 36 24 36c-5.202 0-9.619-3.317-11.283-7.946l-6.522 5.025C9.505 39.556 16.227 44 24 44z"/>
                    <path fill="#1976D2" d="M43.611 20.083H42V20H24v8h11.303c-.792 2.237-2.231 4.166-4.087 5.571.001-.001.002-.001.003-.002l6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z"/>
                </svg>
                Sign in with Google
            </button>

            <div id="userInfo"
                style="display:none; margin-bottom: 1rem; padding: 1rem; background: rgba(255,255,255,0.05); border-radius: 12px; border: 1px solid var(--glass-border);">
                <p id="userEmail"
                    style="font-size: 0.9rem; color: var(--text-main); margin-bottom: 0.5rem; word-break: break-all;">
                </p>
                <button id="signOutBtn"
                    style="background: rgba(239, 68, 68, 0.2); border: 1px solid var(--danger); color: var(--danger); cursor: pointer; padding: 0.5rem 1rem; border-radius: 8px; width: 100%; transition: 0.2s;">
                    <i class="fa-solid fa-right-from-bracket"></i> Sign Out
                </button>
            </div>
            <ul id="allBookingsList" class="all-bookings-list">
                <!-- Bookings injected here -->
                <li class="loading-item">Loading...</li>
            </ul>
        </aside>

        <!-- Main Calendar -->
        <main class="main-content">
            <header>
                <h1><i class="fa-regular fa-calendar-check"></i> Morning Assembly</h1>
                <p>Select a Monday, Wednesday or Thursday</p>
            </header>

            <div class="calendar-controls">
                <button id="prevMonth" class="nav-btn"><i class="fa-solid fa-chevron-left"></i></button>
                <h2 id="currentMonthDisplay">October 2023</h2>
                <button id="nextMonth" class="nav-btn"><i class="fa-solid fa-chevron-right"></i></button>
            </div>

            <div class="calendar-wrapper">
                <div class="weekdays">
                    <div>Sun</div>
                    <div>Mon</div>
                    <div>Tue</div>
                    <div>Wed</div>
                    <div>Thu</div>
                    <div>Fri</div>
                    <div>Sat</div>
                </div>
                <div id="calendarGrid" class="calendar-grid">
                    <!-- Days will be injected here -->
                </div>
            </div>
        </main>
    </div>

    <!-- Booking Modal -->
    <div id="bookingModal" class="modal">
        <div class="modal-content glass-panel">
            <span class="close-modal">&times;</span>
            <h3 id="modalDateTitle">Book for ...</h3>
            <div class="slot-info">
                <div class="progress-ring">
                    <!-- Simple visualization of remaining time -->
                    <svg viewBox="0 0 36 36" class="circular-chart">
                        <path class="circle-bg" d="M18 2.0845
                            a 15.9155 15.9155 0 0 1 0 31.831
                            a 15.9155 15.9155 0 0 1 0 -31.831" />
                        <path class="circle" stroke-dasharray="100, 100" d="M18 2.0845
                            a 15.9155 15.9155 0 0 1 0 31.831
                            a 15.9155 15.9155 0 0 1 0 -31.831" />
                        <text x="18" y="20.35" class="percentage">20m</text>
                    </svg>
                </div>
                <div class="text-info">
                    <p>Total Capacity: <span id="totalCapacity" class="highlight">-- mins</span></p>
                    <p>Remaining: <span id="remainingTime" class="highlight">...</span></p>
                </div>
            </div>

            <form id="bookingForm">
                <input type="hidden" id="selectedDate">

                <div class="form-group">
                    <label for="userName">Name / Department</label>
                    <input type="text" id="userName" required placeholder="e.g. Science Dept">
                </div>

                <div class="form-group">
                    <label for="topic">Topic (Optional)</label>
                    <input type="text" id="topic" placeholder="e.g. Science Fair Announcement">
                </div>

                <div class="form-group">
                    <label for="slideLink">Slide Link (Optional)</label>
                    <input type="url" id="slideLink" placeholder="e.g. https://docs.google.com/presentation/d/...">
                </div>

                <div class="form-group checkbox-group">
                    <label class="checkbox-label" for="gcPost">
                        <input type="checkbox" id="gcPost">
                        GC Post
                    </label>
                    <small class="field-hint">Also post this booking to Google Classroom.</small>
                </div>

                <div class="form-group">
                    <label for="duration">Duration</label>
                    <select id="duration" required>
                        <!-- Duration options are populated dynamically (5-minute
                             increments) based on the selected day's schedule. -->
                        <option value="" disabled selected>Select duration</option>
                    </select>
                </div>

                <div id="formFeedback" class="feedback"></div>

                <button type="submit" class="submit-btn">Confirm Booking</button>
            </form>

            <div class="existing-bookings">
                <h4>Existing Bookings</h4>
                <ul id="bookingList">
                    <!-- List items -->
                </ul>
            </div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>

</html>
